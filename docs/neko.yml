input: .
output: .neko

# Served by GitHub Pages from the gh-pages branch of curiosity-ai/x-ray (see
# .devops/build-docs.yml), on its own hostname. Neko writes every link root-relative
# (/assets/..., /content/) and has no base-path setting, so the site cannot live under the
# /x-ray/ path of curiosity-ai.github.io: it needs a host of its own, the same way
# docs.curiosity.ai is served. Neko writes `url`'s host into the CNAME file of the output,
# which is what tells GitHub Pages which domain to answer for. The DNS side is a CNAME
# record for xray.curiosity.ai pointing at curiosity-ai.github.io.
url: xray.curiosity.ai

branding:
  title: "X-Ray"
  label: "Docs"
  logo: /assets/logo.png
  logoDark: /assets/logo.png
  favicon: /assets/logo.png
  repository: https://github.com/curiosity-ai/x-ray

links:
  - text: "Home"
    icon: house-chimney
    link: /
  - text: "Get started"
    icon: rocket
    link: /getting-started/
  - text: "Packages"
    icon: box-open
    items:
      - text: "X-Ray.Content"
        link: /content/
        icon: file-export
        description: "Text, Markdown, HTML and JSON from 90+ formats, for search and LLMs."
      - text: "X-Ray.Office"
        link: /office/
        icon: file-word
        description: "Word, Excel and PowerPoint rendered to PDF and images."
      - text: "X-Ray.Psd"
        link: /psd/
        icon: file-psd
        description: "Photoshop PSD/PSB: layers, compositing, text."
      - text: "X-Ray.Email"
        link: /email/
        icon: envelope
        description: "Outlook MSG, EML and CFB: read, convert, HTML preview."
      - text: "X-Ray.Ics"
        link: /ics/
        icon: calendar
        description: "iCalendar and vCalendar: events, recurrence, attendees, writer."
      - text: "X-Ray.PS"
        link: /ps/
        icon: file-eps
        description: "PostScript, EPS and XPS to PDF and images."
      - text: "X-Ray.OneNote"
        link: /onenote/
        icon: notebook
        description: "OneNote .one pages, text, PDF and HTML export."
  - text: "Contributing"
    icon: code-branch
    link: /contributing/
  - text: "GitHub"
    icon: brands-github
    link: https://github.com/curiosity-ai/x-ray

pageLinks:
  - label: Report an issue
    icon: bug
    url: "https://github.com/curiosity-ai/x-ray/issues/new?title=Docs%3A%20${url}"
    target: blank

footer:
  copyright: "&copy; {{ year }} Curiosity GmbH."

meta:
  title: " | X-Ray"
  description: "Documentation for X-Ray: pure C# .NET packages for content extraction, rendering documents to PDF and images, and reading PSD, email, iCalendar, PostScript/XPS and OneNote files."

breadcrumb:
  home: ":icon-house-chimney:"

toc:
  label: On this page
  depth: 2-3

poweredByNeko: false
