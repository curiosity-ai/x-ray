# Builds the X-Ray documentation site (docs/, a Neko project) and publishes it to the gh-pages
# branch of curiosity-ai/x-ray, which GitHub Pages serves at https://x-ray.curiosity.ai/ (the
# hostname comes from the CNAME file Neko writes from docs/neko.yml's `url`).
# The same steps as curiosity-ai/documentation's .devops/build-website.yml: install or update the
# Neko .NET tool, build, then force-push the output as a fresh single-commit gh-pages branch.
#
# Needs three pipeline variables (secret where it matters), as in the documentation pipeline:
#   username  GitHub account that pushes gh-pages
#   pat       a token for it with contents:write on curiosity-ai/x-ray
#   email     the commit email for that account
variables:
  repo: 'https://$(username):$(pat)@github.com/curiosity-ai/x-ray.git'
  msg: 'update_site_$(build.buildId)'

pool:
  vmImage: 'windows-latest'

trigger:
  branches:
    include:
    - main
  paths:
    include:
    - docs/*
    - build.bat
    - .devops/build-docs.yml

pr: none

steps:
- checkout: self
  persistCredentials: true

- task: NuGetToolInstaller@1

- task: UseDotNet@2
  displayName: 'Use .NET 10.0 sdk'
  inputs:
    packageType: sdk
    version: 10.x
    installationPath: $(Agent.ToolsDirectory)/dotnet

- task: CmdLine@2
  displayName: 'git config'
  inputs:
    script: |
      git config --global credential.helper store
      git config --global user.email "$(email)"
      git config --global user.name "$(username)"
      git config --global user.password "$(pat)"

# `dotnet tool update` installs the tool when it is missing, so one command covers both.
- task: CmdLine@2
  displayName: 'install/update neko'
  inputs:
    script: |
      dotnet tool update Neko --global

- task: CmdLine@2
  displayName: 'build site'
  inputs:
    script: |
      build.bat

- task: PowerShell@2
  displayName: 'push website changes if any'
  inputs:
    targetType: 'inline'
    script: |
      cd $(Build.SourcesDirectory)\.build
      # GitHub Pages would otherwise run Jekyll over the output and drop paths starting with _.
      New-Item -ItemType File -Force .nojekyll | Out-Null
      git init
      git config core.autocrlf true
      git config core.safecrlf false
      git add .
      git commit -m $(msg)
      git branch gh-pages
      git checkout gh-pages
      git remote add origin $(repo)
      git push --set-upstream origin gh-pages --force
    errorActionPreference: 'continue'
    ignoreLASTEXITCODE: true
