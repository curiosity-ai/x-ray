# Publishes X-Ray, the family's umbrella metapackage, to nuget.org. Same shape as the members'
# pipelines (curiosity-ai/x-ray-content's .devops/build-x-ray-nuget.yml): CalVer versioning off
# the build id, pack, then push through the shared `nuget-curiosity-org` service connection.
#
# The members live in their own repositories and are published by their own pipelines, so this
# one cannot pack them alongside. Instead it asks nuget.org for the newest version of each member
# (.devops/resolve-member-versions.ps1, reading the list in src/XRay/Members.props) and passes
# those as MSBuild properties, so every X-Ray release pins the newest members published at the
# time it runs. Queue this pipeline after a member ships to carry its new version into X-Ray.
#
# The same run also builds, tests and publishes X-Ray.DocumentExtraction (src/XRay.DocumentExtraction),
# the Microsoft.Extensions.DocumentExtraction provider. It depends on X-Ray.Content, so it takes the
# resolved XRayContentVersion like the umbrella does and ships against the newest published
# X-Ray.Content. The abstraction it implements is a prerelease and nuget.org refuses a stable package
# that depends on one, so it is versioned `<umbrella version>-preview`. The umbrella resolver takes
# stable versions only, so the umbrella does not install it.
#
# A member that is not on nuget.org yet is skipped with a warning and left out of the package,
# so the umbrella can ship while the family is still arriving. Tick `strictMembers` when queueing
# a run to fail instead. To hold one member back, set a pipeline variable named after
# its property (for example XRayOfficeVersion=26.9.1234) and the resolver keeps that value.
variables:
  umbrella: './src/XRay/XRay.csproj'
  provider: './src/XRay.DocumentExtraction/XRay.DocumentExtraction.csproj'
  providerTests: './tests/XRay.DocumentExtraction.Tests/XRay.DocumentExtraction.Tests.csproj'
  buildConfiguration: 'Release'
  targetVersion: yy.M.$(build.buildId)
  previewVersion: yy.M.$(build.buildId)-preview
  # Filled in by the 'Resolve member versions' step.
  memberArgs: ''
  memberProps: ''

# A runtime parameter rather than a variable: it is offered in the 'Run pipeline' dialog, and the
# template expression below can read it (a queue-time variable is not visible at that stage).
parameters:
- name: strictMembers
  displayName: 'Fail if any member is not published yet'
  type: boolean
  default: false

trigger:
  branches:
    include:
    - main
  paths:
    include:
    - src/*
    - tests/*
    - assets/*
    - Directory.Build.props
    - global.json
    - .devops/build-x-ray-nuget.yml
    - .devops/resolve-member-versions.ps1

pr: none

pool:
  vmImage: 'windows-latest'

steps:
- task: PowerShell@2
  displayName: 'Create CalVer Version'
  inputs:
    targetType: 'inline'
    script: |
      $dottedDate = (Get-Date).ToString("yy.M")
      $buildID = $($env:BUILD_BUILDID)
      $modBuildID = [int]$buildID % 65536  # ensure fits in int16
      $newTargetVersion = "$dottedDate.$modBuildID"
      Write-Host "##vso[task.setvariable variable=targetVersion;]$newTargetVersion"
      Write-Host "Updated targetVersion to '$newTargetVersion'"
      Write-Host "##vso[task.setvariable variable=previewVersion;]$newTargetVersion-preview"
      Write-Host "Updated previewVersion to '$newTargetVersion-preview'"


- task: PowerShell@2
  displayName: 'Resolve member versions'
  inputs:
    targetType: 'filePath'
    filePath: '$(Build.SourcesDirectory)/.devops/resolve-member-versions.ps1'
    ${{ if parameters.strictMembers }}:
      arguments: '-Strict'
    pwsh: true


- task: UseDotNet@2
  displayName: 'Use .NET 10.0 SDK'
  inputs:
    packageType: sdk
    version: 10.x
    includePreviewVersions: false
    installationPath: $(Agent.ToolsDirectory)\dotnet

# The member versions go to every step. Restore needs them to resolve the right packages, and
# pack reads its dependency list from the same evaluation, so a step without them would see a
# package with no members (which the project refuses to pack: error XRAY003).
- task: DotNetCoreCLI@2
  inputs:
    command: 'restore'
    projects: '$(umbrella)'
    restoreArguments: '$(memberArgs)'
  displayName: 'restore nuget'

# The provider takes the same member arguments: XRayContentVersion is the newest X-Ray.Content on
# nuget.org (or the pinned one), so it is rebuilt against the current X-Ray.Content every run.
- task: DotNetCoreCLI@2
  inputs:
    command: 'restore'
    # One pattern per line: this task does not split a `;`-separated list, so it matched no file.
    projects: |
      $(provider)
      $(providerTests)
    restoreArguments: '$(memberArgs)'
  displayName: 'restore provider'

- task: DotNetCoreCLI@2
  inputs:
    command: 'build'
    projects: '$(umbrella)'
    arguments: '-c $(buildConfiguration) --no-restore /p:Version=$(targetVersion) /p:LangVersion=latest $(memberArgs)'
  displayName: 'build'

- task: DotNetCoreCLI@2
  inputs:
    command: 'build'
    projects: '$(provider)'
    arguments: '-c $(buildConfiguration) --no-restore /p:Version=$(previewVersion) /p:LangVersion=latest $(memberArgs)'
  displayName: 'build provider'

- task: DotNetCoreCLI@2
  inputs:
    command: 'test'
    projects: '$(providerTests)'
    arguments: '-c $(buildConfiguration) $(memberArgs)'
  displayName: 'test provider'

- task: DotNetCoreCLI@2
  inputs:
    command: 'pack'
    packagesToPack: '$(provider)'
    packDirectory: '$(Build.ArtifactStagingDirectory)'
    versioningScheme: 'off'
    configuration: '$(buildConfiguration)'
    buildProperties: 'Version="$(previewVersion)";LangVersion="latest";$(memberProps)'
    nobuild: true
  displayName: 'pack provider'

- task: DotNetCoreCLI@2
  inputs:
    command: 'pack'
    packagesToPack: '$(umbrella)'
    packDirectory: '$(Build.ArtifactStagingDirectory)'
    versioningScheme: 'off'
    configuration: '$(buildConfiguration)'
    buildProperties: 'Version="$(targetVersion)";LangVersion="latest";$(memberProps)'
    nobuild: true
  displayName: 'pack nuget'

# Push every package in one step, as sentence-transformers-sharp does. No NuGetToolInstaller step:
# it put nuget.exe 6.4 on the path, which refuses an API key service connection, whereas the push
# task's own bundled nuget.exe accepts it. No symbol packages (.snupkg) are produced, so nothing
# beside a .nupkg can fail the push.

- task: NuGetCommand@2
  displayName: 'push nuget'
  inputs:
    command: 'push'
    packagesToPush: '$(Build.ArtifactStagingDirectory)/**/*.nupkg'
    nuGetFeedType: 'external'
    publishFeedCredentials: 'nuget-curiosity-org'
