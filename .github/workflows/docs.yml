# Builds the documentation site (docs/, a Neko project) and publishes it to the gh-pages branch of
# curiosity-ai/x-ray, which GitHub Pages serves at https://xray.curiosity.ai/ (the hostname comes
# from the CNAME file Neko writes from docs/neko.yml's `url`).
#
# This is shaped like curiosity-ai/website's workflow: build into a folder, add a `.nojekyll`
# marker, and force-push that folder as the whole content of a `gh-pages` branch. The branch is a
# build artifact, not history; every run replaces it. It replaces the Azure DevOps pipeline that
# did the same with a personal access token: the push here uses the workflow's own token.
#
# The organisation allows only actions it owns, GitHub's own, or `actions/*` and
# `peaceiris/actions-gh-pages@*`, each pinned to a commit SHA. This workflow uses two `actions/*`
# steps and plain shell for the rest. Re-pin by resolving the tag you want, for example
# `git ls-remote --tags --refs https://github.com/actions/checkout 'v4.*'`, and updating both the
# SHA and the version in the comment.
#
# One-time setup: Settings -> Pages -> Source = the `gh-pages` branch, folder `/ (root)`, with the
# custom domain xray.curiosity.ai (DNS: a CNAME record pointing at curiosity-ai.github.io).
name: Publish docs to gh-pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'build.sh'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Pushing a branch needs write access to the repository's contents. Nothing else does.
permissions:
  contents: write

# Never publish twice at once, and let a queued run finish rather than cancelling it: the branch
# is force-pushed, so a cancelled run can leave the site on an older commit.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Neko is a .NET global tool.
      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.x

      # `dotnet tool update` installs the tool when it is missing, so one command covers both.
      - name: Install Neko
        run: |
          set -eu
          dotnet tool update Neko --global
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Build site
        run: ./build.sh

      # A broken link is silent until somebody clicks it.
      - name: Check links
        run: Neko check-links -i docs

      - name: Force-push to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          cd .build
          # GitHub Pages would otherwise run Jekyll over the output and drop paths starting with _.
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA} from ${GITHUB_REF_NAME}"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
